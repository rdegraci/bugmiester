[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bugmiester"
version = "0.1.0"
description = "Localhost Swift bug-spotting trainer powered by LLMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "PyYAML>=6.0.2",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
  "openai>=1.55.0",
  "anthropic>=0.39.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
bugmiester = "bugmiester.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bugmiester = ["eval/golden_cases.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
